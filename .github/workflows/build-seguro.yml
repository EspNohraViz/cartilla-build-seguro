# Pipeline de build seguro: el artefacto solo se publica si pasa TODAS las compuertas.
#
#   1. secretos      -> Gitleaks busca credenciales filtradas en el historial
#   2. build-sast    -> compila, prueba, analiza el código (SpotBugs + FindSecBugs) y genera SBOM
#   3. dependencias  -> OSV-Scanner revisa las dependencias contra vulnerabilidades conocidas
#   4. dast          -> levanta la aplicación y la ataca con OWASP ZAP (baseline)
#   5. publicar      -> solo si 1-4 pasan: checksum, procedencia firmada y artefacto final
#
# Buenas prácticas aplicadas al propio pipeline (asegurar la cadena de herramientas):
#   - Cada acción de terceros está fijada por su hash de commit, no por etiqueta.
#   - Permisos mínimos: el token solo puede leer, salvo donde se necesita firmar.
#   - Agentes efímeros: cada job corre en una máquina nueva que se destruye al terminar.

name: Build seguro

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secretos:
    name: "1 · Escaneo de secretos"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-sast:
    name: "2 · Compilación + SAST + SBOM"
    needs: secretos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar, probar y analizar (falla si SpotBugs encuentra un patrón inseguro)
        working-directory: app
        run: mvn -B --no-transfer-progress verify
      - name: Guardar candidato a artefacto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidato
          path: |
            app/target/build-seguro-*.jar
            app/target/sbom.json
          retention-days: 7

  dependencias:
    name: "3 · Análisis de dependencias (SCA)"
    needs: secretos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSV-Scanner (falla si alguna dependencia tiene una vulnerabilidad conocida)
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=./osv-scanner.toml
            --recursive
            ./app

  dast:
    name: "4 · Análisis dinámico (DAST)"
    needs: build-sast
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidato
          path: candidato
      - name: Levantar la aplicación
        run: |
          nohup java -jar candidato/build-seguro-*.jar > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ > /dev/null && exit 0; sleep 1; done
          cat app.log; exit 1
      - name: OWASP ZAP baseline (falla si hay alertas)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080/
          rules_file_name: .zap/reglas.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: reporte-zap

  publicar:
    name: "5 · Publicar artefacto verificado"
    needs: [build-sast, dependencias, dast]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write      # firma sin llaves de larga duración (Sigstore)
      attestations: write  # registro de la procedencia del artefacto
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidato
          path: dist
      - name: Huella SHA-256 del artefacto
        working-directory: dist
        run: |
          sha256sum build-seguro-*.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Procedencia firmada (SLSA)
        if: github.event.repository.visibility == 'public' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/build-seguro-*.jar
      - name: Publicar artefacto verificado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-seguro-verificado
          path: dist/
